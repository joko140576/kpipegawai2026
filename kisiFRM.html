<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Divisi FRM</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(135deg,#0d6efd,#0dcaf0);
    min-height:100vh;
}

.card{
    border-radius:20px;
}

iframe{
    width:100%;
    height:900px;
    border:none;
    border-radius:15px;
    margin-top:20px;
    background:white;
}
</style>
</head>

<body>

<div class="container py-5">
    <div class="card shadow-lg p-4">
        
        <h2 class="text-center fw-bold mb-4 text-primary">
            KPI DIVISI FRM
        </h2>

        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <label class="fw-bold mb-2">Pilih Jabatan :</label>
                <select class="form-select form-select-lg" id="jabatanSelect">
                    <option value="">-- Pilih Jabatan --</option>
                    <option value="smaccoutingtaxbudget.html">Senior Manager Accounting Tax & Budgeting</option>
                    <option value="smbillco&treasury.HTML">Senior Manager Billco & Treasury</option>
                    <option value="mgrtax.HTML">Manager Tax</option>
                    <option value="mgrtax.HTML">Staf Tax</option>
                    <option value="mgraccounting.html">Manager Accounting</option>
                    <option value="stafaccounting.html">Staf Accounting</option>
                     <option value="stafbudgeting.html">Staf Budgeting</option>
                    <option value="mgrbillco.html">Manager Billco</option>
                    <option value="mgrbillco.html">Staf Billco</option>
                    <option value="mgrtreasury.html">Manager Treasury</option>
                    <option value="mgrtreasury.html">Staf Treasury</option>    
                    <option value="smmanrisk.html">Senior Manager Manrisk</option> 
                    <option value="mgrmanrisk.html">Manager Manrisk</option>   
                    <option value="mgrmanrisk.html">Staf Manrisk</option>   
                </select>

            </div>
        </div>

        <!-- Container Tabel -->
        <iframe id="kpiFrame" class="d-none"></iframe>

    </div>
</div>

<script>
document.getElementById("jabatanSelect").addEventListener("change", function(){
    
    let selectedFile = this.value;
    let frame = document.getElementById("kpiFrame");

    if(selectedFile !== ""){
        frame.src = selectedFile;
        frame.classList.remove("d-none");
    }else{
        frame.classList.add("d-none");
        frame.src = "";
    }
});
</script>

</body>
</html>
