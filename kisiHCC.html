/* ================= PILIH KPI ================= */
document.getElementById("kpiSelect").addEventListener("change", function(){
  const val = this.value;
  renderTable(val);
});

/* ================= RENDER TABEL ================= */
function renderTable(type){
  document.getElementById("hasilBody").innerHTML = "";
  document.getElementById("prosesBody").innerHTML = "";
  document.getElementById("totalHasil").innerText = "0%";
  document.getElementById("totalProses").innerText = "0%";
  

  if(!dataKPI[type]) return;

  renderRows(dataKPI[type].hasil, "hasilBody");
  renderRows(dataKPI[type].proses, "prosesBody");
}

/* ================= BARIS ================= */
function renderRows(data, target){
  data.forEach((item, i) => {
    document.getElementById(target).innerHTML += `
      <tr>
        <td>${i+1}</td>
        <td>${item.kpi}</td>
        <td>${item.target}</td>
        <td>${item.bobot}</td>
        <td>
          <input type="number" min="0" max="100"
            class="form-control nilai"
            data-bobot="${item.bobot}">
        </td>
        <td class="hasil">0</td>
      </tr>`;
  });
}

/* ================= HITUNG ================= */
document.addEventListener("input", function(e){
  if(!e.target.classList.contains("nilai")) return;

  let totalHasil = 0;
  let totalProses = 0;

  document.querySelectorAll("#hasilBody tr").forEach(row=>{
    const nilai = row.querySelector(".nilai").value || 0;
    const bobot = row.querySelector(".nilai").dataset.bobot;
    const hasil = (nilai * bobot / 100).toFixed(2);
    row.querySelector(".hasil").innerText = hasil;
    totalHasil += parseFloat(hasil);
  });

  document.querySelectorAll("#prosesBody tr").forEach(row=>{
    const nilai = row.querySelector(".nilai").value || 0;
    const bobot = row.querySelector(".nilai").dataset.bobot;
    const hasil = (nilai * bobot / 100).toFixed(2);
    row.querySelector(".hasil").innerText = hasil;
    totalProses += parseFloat(hasil);
  });

  document.getElementById("totalHasil").innerText = totalHasil.toFixed(2)+"%";
  document.getElementById("totalProses").innerText = totalProses.toFixed(2)+"%";
  
});
